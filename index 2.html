<style>
:root{--bg:#3a2b08;--bg2:#4d3a0e;--cream:#f3e9dc;--gold:#e0a02b;--gold2:#cf8a24;--red:#d9261c;--ink:#1a1305;--ok:#1f9d55;--no:#b3261e;
--fd:Anton,Impact,"Arial Narrow",sans-serif;--fb:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:var(--fb);color:var(--cream);overflow-x:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;
background:radial-gradient(ellipse at 50% 0%,rgba(224,160,43,.28),transparent 60%),repeating-conic-gradient(from 0deg at 50% -10%,rgba(255,255,255,.035) 0 5deg,transparent 5deg 14deg),linear-gradient(180deg,var(--bg2),var(--bg))}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.page{max-width:760px;margin:0 auto;padding:16px 16px 40px}

/* splash */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(255,255,255,.3) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 16s linear infinite}
#splash img{position:relative;height:min(52vh,70vw);width:auto;animation:pop .8s ease-out both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

/* header */
.top{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#f6eee3,#e6d6c6);border-radius:18px;padding:14px 18px;border-bottom:5px solid var(--gold);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.top img{height:clamp(58px,13vw,92px);width:auto;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.top h1{margin:0;font:400 clamp(34px,9.500vw,66px)/.98 var(--fd);color:#120d03;letter-spacing:.5px}
.top h1 span{color:var(--red)}
.top p{margin:6px 0 0;font:600 clamp(13px,3.200vw,17px)/1.2 var(--fb);color:#5b4720;letter-spacing:.6px;text-transform:uppercase}
.ig{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;background:#120d03;color:#fff;display:none;place-items:center}
.ig.on{display:grid}
.info{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font:600 15px var(--fb)}
.chip b{color:var(--gold);font-weight:700;margin-right:6px;text-transform:uppercase;letter-spacing:.6px}

/* hero CTA */
.hero{display:flex;align-items:center;gap:16px;margin-top:20px;padding:20px 20px;border-radius:18px;color:var(--ink);background:linear-gradient(135deg,#f2b73c,#d98a1d);box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 0 rgba(224,160,43,.6);animation:glow 2.800s ease-in-out infinite;transition:transform .15s}
.hero:hover{transform:translateY(-2px)}.hero:active{transform:scale(.98)}
@keyframes glow{50%{box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 10px rgba(224,160,43,0)}}
.hero .t{flex:1}
.hero small{display:block;font:600 15px var(--fb);letter-spacing:.8px;text-transform:uppercase;opacity:.8}
.hero b{display:block;font:400 clamp(28px,7.500vw,44px)/1.05 var(--fd);letter-spacing:.4px;margin-top:2px}
.hero .go{flex:none;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center}

/* grup */
.sec{margin:28px 4px 12px;display:flex;align-items:center;gap:12px;font:400 20px var(--fd);letter-spacing:1.600px;color:var(--gold);text-transform:uppercase}
.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(224,160,43,.6),transparent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px 14px;border-radius:14px;background:var(--gold2);color:var(--ink);box-shadow:0 5px 14px rgba(0,0,0,.28);transition:transform .15s,filter .15s;position:relative}
.item:hover{filter:brightness(1.08);transform:translateY(-2px)}.item:active{transform:scale(.97)}
.item .ic{flex:none;width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.14);display:grid;place-items:center}
.item .tx{flex:1;min-width:0}
.item b{display:block;font:700 clamp(16px,4vw,19px)/1.15 var(--fb);text-transform:uppercase;letter-spacing:.3px}
.item small{display:block;margin-top:3px;font:500 14px/1.2 var(--fb);opacity:.78}
.item.wa{background:#fff}
.item.wa .ic{background:#e9f9ef}
.badge{position:absolute;top:-8px;right:10px;padding:3px 10px;border-radius:999px;font:700 12px var(--fb);letter-spacing:.8px;color:#fff}
.badge.open{background:var(--ok)}.badge.closed{background:var(--no)}
.item.closed{background:#b49256;filter:saturate(.7)}
.in{animation:rise .5s ease-out both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* tampilan setelah menu dipilih */
#view{display:none;text-align:center;padding:48px 8px}
.spin{width:50px;height:50px;border:5px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;margin:0 auto 22px;animation:spin 1s linear infinite}
#view h2{margin:0 0 10px;font:400 clamp(26px,7vw,40px)/1.1 var(--fd)}
#view p{margin:0 0 22px;line-height:1.5;opacity:.85;font-size:18px}
.btn{display:inline-block;margin:6px;padding:14px 26px;border-radius:12px;background:var(--gold);color:var(--ink);font:700 18px var(--fb);text-transform:uppercase;letter-spacing:.5px;border:0;cursor:pointer}
.btn.alt{background:var(--cream)}
.bk{display:none;margin:16px 0 0;padding:10px 18px;border-radius:999px;border:0;background:var(--cream);color:var(--ink);font:700 16px var(--fb);text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
.foot{margin-top:34px;text-align:center;font:500 14px var(--fb);opacity:.6}

@media (max-width:480px){.hero{gap:10px}.hero .t{min-width:0}.hero b{font-size:clamp(22px,6.200vw,34px)}.hero .chip{padding:5px 10px;font-size:13px}.hero .go{width:44px;height:44px}.grid{grid-template-columns:1fr}.top{padding:12px 14px}.hero{padding:18px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var home=document.getElementById('home'),view=document.getElementById('view'),topback=document.getElementById('topback'),sp=document.getElementById('splash'),n=0;
Array.prototype.forEach.call(document.querySelectorAll('[data-logo]'),function(e){e.src=LOGO});
document.getElementById('fav').href=LOGO;

function badge(s){return s?'<span class="badge '+s+'">'+(s=="open"?"DIBUKA":"DITUTUP")+'</span>':''}
function delay(){return 'style="animation-delay:'+(.1*(n++)+.15)+'s"'}
var h='<a class="hero in" '+delay()+' href="'+HERO.u+'" target="_blank" rel="noopener" data-t="'+HERO.t+'"><div class="t"><small>'+HERO.lead+'</small><b>'+HERO.t+'</b></div>'+(HERO.status?'<span class="chip" style="background:rgba(0,0,0,.16);border-color:transparent;color:#1a1305;font-weight:700">DIBUKA</span>':'')+'<span class="go">'+ARROW+'</span></a>';

 g.items.forEach(function(x){
  h+='<a class="item in'+(x.wa?' wa':'')+(x.status=="closed"?' closed':'')+'" '+delay()+' href="'+x.u+'" target="_blank" rel="noopener" data-t="'+x.t+'">'+badge(x.status)+'<span class="ic">'+x.i+'</span><span class="tx"><b>'+x.t.replace(/&/g,'&amp;')+'</b><small>'+x.d+'</small></span></a>';

/* splash: sekali per kunjungan */
function endSplash(){sp.classList.add('hide');setTimeout(function(){sp.style.display='none'},600)}
var seen=false;try{seen=sessionStorage.getItem('s12')}catch(e){}
if(seen){sp.style.display='none'}else{try{sessionStorage.setItem('s12','1')}catch(e){}setTimeout(endSplash,1800)}

/* klik menu: tautan terbuka di tab baru, halaman ini menampilkan tombol kembali */
home.addEventListener('click',function(e){
 var a=e.target.closest('a[data-t]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey)return;
 location.hash='buka';
 document.getElementById('vt').textContent='MEMBUKA '+a.getAttribute('data-t');
 document.getElementById('go').href=a.href;
 home.style.display='none';view.style.display='block';topback.style.display='inline-block';
 document.getElementById('info').style.display='none';window.scrollTo(0,0);
});
function showHome(){view.style.display='none';topback.style.display='none';home.style.display='block';info.style.display=ih?'flex':'none';window.scrollTo(0,0)}
function goBack(e){if(e)e.preventDefault();if(location.hash){history.back()}else{showHome()}}
document.getElementById('back').onclick=goBack;topback.onclick=goBack;
if(location.hash){history.replaceState(null,'',location.pathname+location.search)}
window.addEventListener('hashchange',function(){if(!location.hash)showHome()});
window.addEventListener('pageshow',function(){if(!location.hash)showHome()});
